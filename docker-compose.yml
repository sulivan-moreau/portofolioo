services:
  front:
    build:
      context: ./front
      dockerfile: Dockerfile
    container_name: portofolioo_front
    expose:
      - "80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
